<!doctype html><meta charset="utf-8"><title>플립시계 미리보기</title>
<style>body{background:#2a2a2a;color:#ddd;font-family:-apple-system,sans-serif;padding:24px}
.row{margin:0 0 26px}.lab{font-size:15px;margin-bottom:8px}.box{width:992px;height:232px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #555}
.small{width:248px;height:58px;border-radius:6px;overflow:hidden;margin-top:8px;box-shadow:0 0 0 2px #555}</style>
<h2>플립시계 — Stream Deck Neo Infobar (248×58)</h2><p>위: 4배 크게 / 아래: 실제 크기</p>
<div id="list"></div>
<script>document.write(`<script src="flip.js?v=${Date.now()}"><\/script>`)</script>
<script>
const names = {classic:'A. 클래식 (시:분:초)', big:'B. 큼직하게 시:분 + 초 막대', retro:'C. 레트로 아이보리 + 요일·날짜', orange:'D. 주황 포인트'};
const list = document.getElementById('list');
for (const k of Object.keys(FLIPS)) list.insertAdjacentHTML('beforeend', `<div class="row"><div class="lab">${names[k]}</div><div class="box" id="b_${k}"></div><div class="small" id="s_${k}"></div></div>`);
function draw(){ const now = new Date();
  for (const k of Object.keys(FLIPS)) { const s = FLIPS[k](now);
    document.getElementById('b_'+k).innerHTML = s.replace(`width='248' height='58'`, `width='992' height='232'`);
    document.getElementById('s_'+k).innerHTML = s.replace(/id='k/g,"id='s").replace(/#k/g,'#s'); }
  requestAnimationFrame(draw); }
draw();
</script>
