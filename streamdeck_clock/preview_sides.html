<!doctype html><meta charset="utf-8"><title>좌우 글씨 비교</title>
<style>body{background:#2a2a2a;color:#ddd;font-family:-apple-system,sans-serif;padding:24px}
.row{margin:0 0 22px}.lab{font-size:15px;margin-bottom:8px}.box{width:992px;height:232px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px #555}
.small{width:248px;height:58px;border-radius:6px;overflow:hidden;margin-top:8px;box-shadow:0 0 0 2px #555}</style>
<h2>빈티지 필름 시계 D4 — 좌우 글씨 비교</h2><p>숫자는 퓨추라 그대로. 위: 4배 / 아래: 실제 크기</p>
<div id="list"></div>
<script>document.write(`<script src="vintage.js?v=${Date.now()}"><\/script>`)</script>
<script>
const KEYS = ['gold', 'korean', 'stamp', 'portra', 'kodak'];
const list = document.getElementById('list');
for (const k of KEYS) list.insertAdjacentHTML('beforeend', `<div class="row"><div class="lab">${SIDE_LABEL[k]}</div><div class="box" id="b_${k}"></div><div class="small" id="s_${k}"></div></div>`);
function draw(){ const now = new Date();
  for (const k of KEYS) { const s = vintage('futura', now, now.getTime(), k);
    const uniq = (str, p) => str.replace(/id='(\w+)'/g, `id='${p}$1'`).replace(/url\(#(\w+)\)/g, `url(#${p}$1)`);
    document.getElementById('b_'+k).innerHTML = uniq(s, 'b'+k).replace(`width='248' height='58'`, `width='992' height='232'`);
    document.getElementById('s_'+k).innerHTML = uniq(s, 's'+k); }
  requestAnimationFrame(draw); }
draw();
</script>
