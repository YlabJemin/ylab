:root[data-theme="dark"]{--pillb:#36363a;--navbg:#1e1e20;--navcard:#2c2c2e;--star:#f3a48f;--acc:#f7dcd3;--acc2:#e9b3a2;--acctx:#5a2f24;--qlbg2:#1e1e1e;--qlbar2:#2c2c2e;--qltx:#ececec;--pl1:#e9e9ec;--pl2:#4a4a4e;--plhi:rgba(255,255,255,.08);--qlbg:#2a2a2c;--qlbar:#333336;--selbg:#3a3a3e;--bg:#1c1c1e;--bar:#2a2a2c;--line:#3a3a3c;--tx:#ececec;--sub:#9a9a9e;--sub2:#8a8a8e;--sub3:#6a6a6e;--btn:#3a3a3c;--btntx:#c8c8c8;--pill:rgba(44,44,46,.92);--cardbg:#2c2c2e;--sh:rgba(0,0,0,.5);--ring:#1c1c1e;--glass:rgba(20,20,22,.66);--note:#e9b3a2;--empty:#5a5a5e;--pop:rgba(44,44,46,.97);--key:#3a3a3c;--keyline:#4a4a4e}
html,body,#top,#bot,#zoom,.card{transition-property:background-color,color,border-color,left,top,transform,box-shadow,opacity;transition-duration:.3s}

html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Gowun Dodum',sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none}
/* 글꼴 통일: 버튼·입력칸·단축키도 같은 글꼴, 굵기는 전부 보통(고운돋움은 굵은 체가 없어 가짜 굵기가 다른 글꼴처럼 보임) → 폴더 이름과 같은 모양 */
button,input,select,textarea,kbd{font-family:inherit}
body *{font-weight:400!important}
#top{position:fixed;top:0;left:0;right:0;height:44px;padding-left:86px!important;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;font-size:14px;z-index:50;gap:10px}
#top b{font-weight:600}#top .s{color:var(--sub)}
#top .mode{display:flex;gap:4px}
#docName::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e8775d;margin-left:8px;vertical-align:1px;opacity:0;transform:scale(.4);transition:opacity .25s,transform .25s}
body.shot #docName::after{opacity:1;transform:none;animation:shotp 1s ease-in-out infinite}
@keyframes shotp{50%{opacity:.35}}
#top .tb .mode{margin-left:0}
/* Export: Bridge·Map 단추와 같은 모양, 색만 더 진한 분홍 */
#top #xBtn{position:relative;isolation:isolate;border:0;border-radius:6px;padding:5px 12px;font:inherit;font-size:12px;font-weight:700;background:transparent;color:var(--acctx);cursor:pointer;display:flex;align-items:center;gap:0;margin-right:4px;line-height:normal}
#top #xBtn kbd{font-family:inherit;font-size:11px;font-weight:400;background:none;border:0;padding:0;margin-left:4px;color:var(--acctx);opacity:.6}
#top #xBtn::before{content:"";position:absolute;left:3px;right:3px;top:1px;bottom:1px;border-radius:8px;background:#f1a48d;filter:blur(6px);opacity:.95;z-index:-1}
#top #xBtn:hover::before{background:#ec8a70}
#top .mode button{border:0;background:var(--btn);color:var(--btntx);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer}
#top .mode button{position:relative;isolation:isolate;background:transparent} #top .mode button.on{color:var(--acctx);font-weight:600}
#top .mode button::before{content:"";position:absolute;left:4px;right:4px;top:2px;bottom:2px;border-radius:8px;background:#d9d9de;filter:blur(6px);opacity:.75;z-index:-1}   /* 안 고른 탭: 회색 블러셔 */
#top .mode button.on::before{background:var(--pl1);opacity:.9}   /* 고른 탭: 코랄 블러셔. 글씨는 위 레이어라 또렷 */
#top .mode button kbd,.xb kbd{font-family:inherit;font-size:11px;background:none;border:0;padding:0;margin-left:4px;color:var(--sub);opacity:.8}
#top .mode button.on kbd{color:var(--acctx);opacity:.55}
:root[data-theme="dark"] #top .mode button{color:#d6d6da} :root[data-theme="dark"] #top .mode button::before{background:#3c3c40;opacity:.9}   /* 다크: 안 고른 탭 = 어두운 회색 블러셔 + 밝은 글자 (전엔 밝은 블러셔에 밝은 글자, 2026-11-04) */
:root[data-theme="dark"] #top .mode button.on{color:#1d1d1f} :root[data-theme="dark"] #top .mode button.on::before{background:#ededf0;opacity:.95} :root[data-theme="dark"] #top .mode button.on kbd{color:#5a5a5e;opacity:1} :root[data-theme="dark"] #top .mode button kbd{color:#a8a8ad}   /* 다크: 고른 탭 글자 밝게 (왼쪽 패널과 같은 색) */
#top .selpick button{border:0;background:var(--btn);color:var(--btntx);font-size:11px;padding:3px 8px;border-radius:5px;margin-left:3px;cursor:pointer}
#top .selpick button.on{background:var(--tx);color:var(--bg)}
#top .note{color:var(--note);font-size:12px;margin-left:12px}
#view{position:fixed;top:44px;bottom:0;left:0;right:0;overflow:hidden;cursor:default;touch-action:none}
#view.hand{cursor:grab}#view.zoomc{cursor:zoom-in}#view.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.card{position:absolute;border-radius:0;background-size:contain;background-repeat:no-repeat;background-position:center;box-shadow:0 6px 10px var(--sh);transition:left .5s cubic-bezier(.3,.8,.3,1),top .5s cubic-bezier(.3,.8,.3,1),transform .3s,box-shadow .3s,opacity .3s;cursor:pointer}
#world.focus .card:not(.currow){opacity:.4}
.card.cur{z-index:5}
body[data-sel="o"] .card.cur{outline:4px solid var(--star);outline-offset:-2px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
body[data-sel="A"] .card.cur{transform:scale(1.08);box-shadow:0 22px 46px rgba(0,0,0,.34)}
body[data-sel="B"] #world .card:not(.cur){opacity:.42}
body[data-sel="B"] .card.cur{box-shadow:0 14px 34px rgba(0,0,0,.26)}
body[data-sel="C"] .card.cur::after{content:"";position:absolute;left:50%;bottom:-16px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--tx);opacity:.85}
body[data-sel="C"] .card.cur{box-shadow:0 14px 34px rgba(0,0,0,.26)}
#plate,.plate{position:absolute;z-index:1;border-radius:22px;pointer-events:none;opacity:0;background:var(--pl1);filter:blur(11px);transition:opacity .5s var(--me)}
body[data-sel="E"] #plate,body[data-sel="F"] .plate{opacity:1}
body[data-sel="F"] #world:not(.focus) .card.sel{transform:scale(1.07)}
body[data-sel="F"] .card.sel{z-index:5;box-shadow:0 8px 20px var(--sh)}
body[data-sel="E"] .card.cur{box-shadow:0 6px 16px var(--sh)}
body[data-sel="D"] .card.cur{outline:2px solid var(--tx);outline-offset:4px;box-shadow:0 14px 34px rgba(0,0,0,.24)}
.card.lift{transform:scale(1.07);box-shadow:0 30px 60px rgba(0,0,0,.35);z-index:20}
body.rmove #plate,body.rmove .plate{opacity:0!important;transition:opacity .12s}   /* 별점 옮기는 동안 선택 블러셔를 숨겼다가 도착한 뒤 다시 (블러셔가 새 자리에 먼저 튀어나오던 것, 사용자 요청 2026-11-04) */
.card.flash{}
.card .tg{position:absolute;left:8px;bottom:8px;width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 2px var(--ring)}
.card .cap{position:absolute;left:-40px;right:-40px;top:100%;margin-top:calc(8px * var(--k,1));text-align:center;line-height:1.25;pointer-events:none}
.card .fn{font-size:calc(12.5px * var(--k,1));color:var(--tx);white-space:nowrap}
.card .cap .st{font-size:calc(12px * var(--k,1));color:var(--star);letter-spacing:calc(1.5px * var(--k,1));margin-top:calc(2px * var(--k,1))}
.card .cap .st .off{color:var(--sub3);opacity:.6}
.card .oldst{position:absolute;right:8px;bottom:6px;color:var(--star);font-size:13px;text-shadow:0 0 3px var(--ring),0 0 3px var(--ring);letter-spacing:1px}
.rowlab{position:absolute;font-size:22px;color:var(--sub2);white-space:nowrap;transition:top .38s}
.rowlab .c{font-size:16px;color:var(--sub3);margin-left:8px}
.rowlab.on{color:var(--acc2);font-weight:600}
.empty{position:absolute;font-size:18px;color:var(--empty)}
#sticky{position:fixed;left:14px;top:44px;bottom:0;width:0;z-index:40;pointer-events:none}
.slab{position:absolute;z-index:6;font-size:13px;color:var(--sub);padding:3px 10px;border-radius:12px;white-space:nowrap;transform:translate(-100%,-50%) scale(var(--k,1));transform-origin:100% 50%}   /* 맵 줄 이름표: 지도 안, 그 줄 첫 사진 바로 왼쪽에 붙어 사진과 같이 움직임 (2026-11-04, 전엔 화면 왼쪽 고정+늦게 따라옴). 글씨 크기는 --k로 화면에서 일정 */
.slab{pointer-events:auto;cursor:pointer}
.ghost{position:fixed;z-index:70;pointer-events:none;border-radius:0;background-size:cover;background-position:center;box-shadow:0 22px 50px rgba(0,0,0,.32);animation:lift .16s cubic-bezier(.2,.8,.3,1)}
.ghost.still{animation:none}
.ghost.fan{background:none!important;box-shadow:none;animation:none}
.ghost.fan .fc{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.28);transform-origin:50% 115%;transition:transform .26s cubic-bezier(.2,.9,.3,1.15)}
.ghost.fan .fc.main{box-shadow:0 22px 50px rgba(0,0,0,.32)}
.ghost.fan .cnt{z-index:2}
@keyframes lift{from{transform:scale(.55);box-shadow:0 4px 10px rgba(0,0,0,.12)}to{transform:none}}
#bside .row.drop{background:var(--acc);color:var(--acctx)} #bstrip .bt.dir.drop .im{background:var(--acc);border-radius:10px}   /* 폴더로 끌어 놓을 자리 */
.bt.adj .im::after,.card.adj::after{content:"";position:absolute;right:4px;top:4px;width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.55) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><path d='M1 2.5h8M1 5h8M1 7.5h8' stroke='white' stroke-width='1.1'/><circle cx='3.5' cy='2.5' r='1.3' fill='white'/><circle cx='6.5' cy='5' r='1.3' fill='white'/><circle cx='4' cy='7.5' r='1.3' fill='white'/></svg>") center/9px no-repeat;pointer-events:none}   /* 카메라 로우 보정 있음 (브릿지 표시처럼) */
.ghost .cnt{position:absolute;right:-10px;top:-10px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--tx);color:var(--bg);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
#dropband{display:none;position:absolute;z-index:0;opacity:0;transition:top .15s,opacity .15s;pointer-events:none}
.card.dragging{opacity:.3}
#bmain{flex:1;min-width:0;display:flex;flex-direction:column}
#bfilm{flex:none;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bar)}
/* 필름스트립 위치: 아래(기본)·위·왼쪽·오른쪽 */
body.dock-t #bmain{flex-direction:column-reverse}
body.dock-l #bmain{flex-direction:row-reverse} body.dock-r #bmain{flex-direction:row}
body.dock-l #bfilm,body.dock-r #bfilm{width:var(--fw,300px)}
body.dock-l .hsplit,body.dock-r .hsplit{height:auto;width:7px;margin:0 -3px;cursor:col-resize}
body.dock-t #brow{border-top:0;border-bottom:1px solid var(--line)}
body.dock-l #brow,body.dock-r #brow{flex-wrap:wrap;border-top:0;border-bottom:1px solid var(--line)}
body.dock-l #btabs,body.dock-r #btabs{flex-wrap:wrap;flex:1 1 100%}
body.dock-l #brt,body.dock-r #brt{flex:1 1 100%;justify-content:space-between;padding:4px 10px 8px}
body.dock-l #bstrip,body.dock-r #bstrip{flex:1;min-height:0;height:auto;flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto}
/* 모양: 여러 줄(넘치면 아래로, 위아래 스크롤) */
body.swrap #bstrip{flex-wrap:wrap;align-content:flex-start;overflow-x:hidden;overflow-y:auto}
body.swrap:not(.dock-l):not(.dock-r) #bstrip{height:var(--fh,260px)}   /* 한 줄도 같은 --fh 사용 → 모드 바꿔도 높이·크기 그대로 */
body.swrap.dock-l #bstrip,body.swrap.dock-r #bstrip{flex-direction:row;justify-content:flex-start;align-items:flex-start}
body.filmoff #bfilm,body.filmoff .hsplit{display:none}   /* ⌘B 필름스트립 접음 */
/* 세로 배치(왼쪽·오른쪽) 다듬기 (2026-11-01 시안 A): 썸네일이 패널 폭을 채우는 격자(폭을 늘리면 칸이 늘어남, 크기는 --sz 그대로), 탭은 6칸 압축, '한 줄/여러 줄'은 의미 없어 숨김 */
body.dock-l #bstrip,body.dock-r #bstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(84px + 70px * (var(--sz) - 1)),1fr));gap:6px 4px;align-content:start;justify-items:stretch;padding:10px 12px;height:auto;overflow-x:hidden;overflow-y:auto}
body.dock-l #bstrip>.bt,body.dock-r #bstrip>.bt{width:auto;align-self:auto}
body.dock-l .bt .im,body.dock-r .bt .im{width:100%;height:auto;aspect-ratio:var(--a,.6667)}
body.dock-l .bt::before,body.dock-r .bt::before{left:-1px;right:-1px;width:auto;top:-1px;bottom:32px;height:auto}
body.dock-l #brow,body.dock-r #brow{flex-wrap:nowrap;align-items:center;padding:6px 10px 6px 2px;gap:2px}
body.dock-l #btabs,body.dock-r #btabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:0;flex:1 1 auto;overflow:visible}
body.dock-l #btabs button,body.dock-r #btabs button{padding:4px 1px;font-size:9.5px;letter-spacing:-1px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;border-radius:6px}
body.dock-l #btabs button[data-r="all"],body.dock-r #btabs button[data-r="all"]{letter-spacing:0}
body.dock-l #btabs button span,body.dock-r #btabs button span{margin:0;font-size:10.5px;letter-spacing:0}
body.dock-l #brt,body.dock-r #brt{flex:none;padding:0}
body.dock-l #bot .lay,body.dock-r #bot .lay{display:none}
#bstrip::-webkit-scrollbar{width:8px}
#bstrip>.bt{transform:translate(var(--obx,0px),var(--oby,0px));transition:var(--obt,none)}

#bside{flex:none;width:var(--sw,268px);transition:width .25s ease,padding .25s,transform var(--ma) var(--me),opacity var(--ma) var(--me);overflow-y:auto;background:var(--bar);border-right:1px solid var(--line);padding:6px 0 20px;font-size:12.5px}
#bside h5{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.4px;padding:12px 16px 6px;display:flex;justify-content:space-between}
#bside h5 em{font-style:normal;font-weight:400;opacity:.8}
#bside .row.armed{background:var(--acc);color:var(--acctx);box-shadow:inset 0 0 0 1.5px #e8775d}
#bside .row .ct{margin-left:auto;padding-left:8px;font-size:11px;color:var(--sub);opacity:.8;font-variant-numeric:tabular-nums}
#bside .row.on .ct{color:var(--acctx)} #bside .ic.live{color:#e8775d;opacity:1}
#favH.drop{background:var(--acc);color:var(--acctx);border-radius:6px;margin:0 6px} #favH em{opacity:.6}
.navghost{position:fixed;z-index:200;pointer-events:none;padding:4px 10px;border-radius:6px;background:var(--qlbg2);box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:12.5px}
#bside .nsb{border:0;background:transparent;color:var(--sub);font-size:15px;line-height:1;padding:0 4px;border-radius:5px;cursor:pointer}
#bside .nsb:hover{background:var(--btn);color:var(--tx)}
#bside .nsrow{display:flex;gap:6px;margin:2px 10px 4px}
#bside .nsrow input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:5px 8px;border:0;border-radius:6px;background:var(--qlbg2);color:var(--tx);outline:none;box-shadow:inset 0 0 0 1.5px var(--acc2)}
#bside .nsrow button{border:0;border-radius:6px;padding:0 10px;font:inherit;font-size:12px;font-weight:600;background:var(--acc);color:var(--acctx);cursor:pointer}
#bside .nsmsg{font-size:11.5px;color:var(--note);margin:0 14px 6px;min-height:0}
#sesdlg{position:fixed;inset:0;z-index:310;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
#sesdlg.on{display:flex} #sesdlg .box{width:320px;background:var(--qlbg2);color:var(--tx);border-radius:12px;padding:20px 20px 14px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
#sesdlg .tt{font-size:15px;font-weight:600;margin-bottom:6px} #sesdlg .ds{font-size:12.5px;color:var(--sub);line-height:1.5}
#sesdlg .bt2{display:flex;justify-content:flex-end;gap:8px;margin-top:16px} #sesdlg button{border:0;border-radius:6px;padding:6px 14px;font:inherit;font-size:13px;background:var(--btn);color:var(--tx);cursor:pointer} #sesdlg button.dn{background:#e8775d;color:#fff;font-weight:600}
#bside .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 16px;white-space:nowrap}
#bside .kv span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
#bside h5,#bside .sl .t,#bside .grp summary,#bside .sty,#bside .meta .mh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bside h5 em{min-width:0;overflow:hidden;text-overflow:ellipsis;margin-left:8px}
#bside .kv span:first-child{color:var(--sub)} #bside .kv span:last-child{text-align:right}
#bside .sl{padding:5px 16px 4px}
#bside .sl .t{display:flex;justify-content:space-between;color:var(--sub)} #bside .sl .t b{font-weight:400;color:var(--tx)}
#bside .sl .bar{position:relative;height:3px;border-radius:2px;background:var(--line);margin-top:6px}
#bside .sl .bar i{position:absolute;top:-4px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1px var(--sub3),0 1px 2px rgba(0,0,0,.2)}
#bside .sl .bar u{position:absolute;left:50%;top:-2px;width:1px;height:7px;background:var(--sub3)}
#bside .grp{padding:4px 10px 2px}
#bside .grp summary{list-style:none;cursor:pointer;color:var(--sub);font-size:11.5px;padding:4px 6px}
#bside .grp summary::before{content:"▸ ";} #bside .grp[open] summary::before{content:"▾ ";}
#bside .sty{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--tx);font:inherit;font-size:12.5px;padding:5px 12px;border-radius:6px;cursor:pointer}
#bside .sty:hover{background:var(--btn)}
#bside .sh{cursor:pointer;user-select:none}
#bside .sh .chev{display:inline-block;width:6px;height:6px;margin:0 8px 1px 1px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .25s ease}
#bside .sec.open .sh .chev{transform:rotate(45deg) translate(-1px,-1px)}
#bside .sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease,opacity .28s ease;opacity:0}
#bside .sec.open .sb{grid-template-rows:1fr;opacity:1}
#bside .sb>div{min-height:0;overflow:hidden}

  <button class="rb" id="themeBtn" title="화면 모드 (흰 화면 / 어두운 화면)"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.4a6.6 6.6 0 0 0 0 13.2z" fill="currentColor"/></svg></button>
  <button class="rb" id="helpBtn" title="키 도움말 (?)">?</button></div>
<script>
// 데이터는 앱(Swift)이 페이지보다 먼저 window.PICK 으로 넣어 줌: {doc, items:[{n,id,name,ext,r,t}], meta:{info,styles}}
const PICK=window.PICK||{doc:"",items:[],meta:{info:{},styles:[]}};
const META=PICK.meta, DATA=PICK.items;
const BYN={}; for(const d of DATA) BYN[d.n]=d;
let IMGK=`g${PICK.gen||0}`;   /* 폴더·세션마다 다른 주소 → 같은 화면을 재사용해도 이전 폴더의 같은 번호 그림이 캐시에서 나오지 않음 */
const smU=n=>`pick://img/s/${n}?v=${(BYN[n]&&BYN[n].v)||0}&${IMGK}`, bgU=n=>`pick://img/b/${n}?v=${(BYN[n]&&BYN[n].v)||0}&${IMGK}`, mdU=n=>`pick://img/m/${n}?v=${(BYN[n]&&BYN[n].v)||0}&${IMGK}`;   // s 420px · m 900px(맵 확대용) · b 1600px
// 맥 파일 시스템은 한글 이름을 분리 자모(NFD)로 줌 → 고운돋움에 분리 자모 글자가 없어 다른 글꼴로 대체됨. 화면에 찍을 때만 완성형(NFC)으로 (데이터·경로는 그대로)
const NFC=s=>s==null?"":String(s).normalize("NFC");
const NM=it=>NFC((BYN[it.n]||it).name), NMX=it=>{const d=BYN[it.n]||it; return NFC(d.name+(d.ext||""))};
const native=(cmd,o)=>{ try{ window.webkit.messageHandlers.pick.postMessage(Object.assign({cmd},o||{})) }catch(_){} };
// 글꼴이 못 읽히면(간헐) 전체가 산돌고딕으로 보임 → 상태를 로그로 남기고, 실패했으면 파일을 다시 받아 직접 등록
(async()=>{ try{ await document.fonts.ready; let ok=document.fonts.check('12px "Gowun Dodum"'); const st=[...document.fonts].map(f=>f.family+":"+f.status).join(",");
  if(!ok){ const b=await fetch("pick://app/fonts/GowunDodum-Subset.ttf?r="+Date.now()).then(r=>r.arrayBuffer()); const ff=new FontFace("Gowun Dodum",b); await ff.load(); document.fonts.add(ff); ok=document.fonts.check('12px "Gowun Dodum"') }
  document.documentElement.classList.add("fontready"); native("jserr",{msg:`글꼴 상태: ${st} → 고운돋움 ${ok?"사용":"실패"}`}) }catch(e){ native("jserr",{msg:"글꼴 로드 오류 "+e}) } })();
const TAGC={1:"#ff5a52",2:"#ff9f2e",3:"#f5c400",4:"#34c759",5:"#3a8bff",6:"#ff6ac1",7:"#b26bff"}, TAGN={1:"빨강",2:"주황",3:"노랑",4:"초록",5:"파랑",6:"분홍",7:"보라"};   /* 6·7은 캡쳐원·브릿지(할 일=보라)에서 온 것만 보여 줌 */
const KEYTAG={"6":1,"7":3,"8":4,"9":5};   // 지금 앱과 같음
const LABEL=r=>r?"★".repeat(r):"No Rating";
const CW=200, CH=300, GAP=22, ROWGAP=96, LEFT=170, TOP=60, EH=70;   // EH: 사진 없는 줄 높이 (접힘)
const rowH=r=>R[r]&&R[r].length?CH:EH;
const view=document.getElementById("view"), world=document.getElementById("world"), sticky=document.getElementById("sticky");
// 맵 사진 크기 세 단계 (사용자 요청 2026-11-04): Small 85% · Default 100% · Large 115%. ⌘− ⌘+ 또는 Export 아래 버튼. 고른 단계는 저장
const MAPSZ=[["Small",.85],["Default",1],["Large",1.15]];
let mapSzI=1; try{ const v=localStorage.getItem("pick.mapsz"); if(v==="0"||v==="2")mapSzI=+v }catch(_){}   // 저장값 없으면 Default
let cam={x:0,y:0,z:MAPSZ[mapSzI][1]}, mode="map", mapZ=MAPSZ[mapSzI][1], zShow=mapZ;   // mapZ = 목표 배율(줄바꿈 기준), zShow = 화면에 보이는 배율(바꿀 때 부드럽게 따라감)
const LABW=118, MAPM=28;   // 줄 이름표 칸(화면 px) · 최소 좌우 여백
let items=DATA.map((d,i)=>({...d,el:null}));
let booting=true; document.body.classList.add("notrans");   // 첫 프레임(로고 → 화면 교차)까지 전환 효과·진입 애니메이션 없음
let cur=null;

// ── 배치: 별점별 줄, 줄 안은 촬영 순서
let ORD=new Map(), SORT={sort:"by date",rev:false};   // 캡쳐원이 보여 주는 순서 (변형 id → 자리)
const ordOf=it=>{ const k=ORD.get(BYN[it.n].id); return k==null?1e6+ +it.n:k }, ordCmp=(a,b)=>ordOf(a)-ordOf(b);
const SORT_KO={"by name":"이름순","by date":"날짜순","by rating":"별점순","by manual":"직접 순서","by color tag":"색 태그순","by file size":"파일 크기순","by sequence ID":"촬영 순서","by extension":"확장자순"};
function localOrder(){   // 폴더 방식: 픽 안에서 정렬
  const k=SORT.sort, key=it=>k==="by rating"?-it.r:k==="by date"?((META.info[it.n]||{}).dt||""):0;
  const L=[...items].sort((a,b)=>{ const x=key(a),y=key(b); return (x<y?-1:x>y?1:0)||a.n-b.n }); if(SORT.rev)L.reverse();
  ORD=new Map(L.map((it,i)=>[BYN[it.n].id,i])) }
function applyOrder(){ if(!cur){ sortUI(); return } const was=items.map(it=>it.x+","+it.y); layout(); let mv=0; items.forEach((it,i)=>{ if(it.x+","+it.y!==was[i])mv++ }); if(mv&&performance.now()<3000)native("jserr",{msg:`시작 직후 재배치 ${mv}장 (${performance.now()|0}ms)`}); place(); stripKey=""; tabsKey=""; if(mode==="focus")renderBridge(); else hud(); sortUI() }
function sortUI(){ const b=document.getElementById("sortBtn"); if(!b)return; b.querySelector("span").textContent=SORT_KO[SORT.sort]||SORT.sort.replace(/^by /,""); b.querySelector("i").textContent=SORT.rev?"↑":"↓" }
function setSort(sort,rev){ SORT={sort,rev}; if(PICK.mode==="c1") native("setSort",SORT); else { try{localStorage.setItem("pick.sort",JSON.stringify(SORT))}catch(_){}; localOrder(); applyOrder() } sortUI() }
function rowsOf(){const R={5:[],4:[],3:[],2:[],1:[],0:[]};for(const it of items)if(!it.gone&&!it.rej)R[it.r].push(it);for(const k in R)R[k].sort(ordCmp);return R}
let R=rowsOf(), rowY={};
// 맵 배치: 별점 띠마다 창 폭(지금 맵 배율 기준)에 들어가는 만큼 놓고 넘치면 다음 줄로 (2026-11-01 사용자 요청, 전엔 한 줄로 옆으로 끝없이)
const VGAP=58;   // 줄 사이 (이름표 자리)
const colsFor=()=>{ const z=mapZ||1; return Math.max(1,Math.floor((view.clientWidth-2*MAPM-LABW-16*z+GAP*z)/((CW+GAP)*z))) };   // 화면 폭에서 좌우 여백·이름표 칸 빼고 들어가는 만큼
let wrapCols=1; const bandH=r=>{ const n=R[r]?R[r].length:0; return n?Math.ceil(n/wrapCols)*(CH+VGAP)-VGAP:EH };   // 띠 높이
function layout(){
  R=rowsOf(); let y=TOP;
  wrapCols=colsFor();
  for(const r of [5,4,3,2,1,0]){
    rowY[r]=y;
    R[r].forEach((it,i)=>{it.x=LEFT+(i%wrapCols)*(CW+GAP); it.y=y+Math.floor(i/wrapCols)*(CH+VGAP); it.i=i});
    y+=bandH(r)+(R[r].length?ROWGAP:ROWGAP*0.4);
  }
}
// 카드 칸(CW×CH) 안에 사진 비율대로 — 그림자가 사진에 딱 맞음 (비율 모르면 2:3)
function cardBox(it){ const a=ASP[it.n]||2/3; let w=CW,h=CH; if(a>CW/CH) h=CW/a; else w=CH*a; return {w,h,dx:(CW-w)/2,dy:(CH-h)/2} }
function fitCard(it){ if(!it.el)return; const b=cardBox(it); it.el.style.width=b.w+"px"; it.el.style.height=b.h+"px"; it.el.style.left=(it.x+b.dx)+"px"; it.el.style.top=(it.y+b.dy)+"px" }
function mkCard(it){
    const e=document.createElement("div"); e.className="card"; const b=cardBox(it); e.style.width=b.w+"px"; e.style.height=b.h+"px";
    if(!booting) e.style.backgroundImage=`url(${smU(it.n)})`; else it.thumbLazy=true;   // 켤 때는 안 받고 첫 화면 뒤 한가할 때(loadCardThumbs)
    e.onclick=ev=>{ if(moved||it.rej)return; if(ev.metaKey||ev.ctrlKey)toggleSel(it); else if(ev.shiftKey)rangeTo(it,false); else select(it,true) };
    world.appendChild(e); it.el=e; paintCard(it); if(it.t)paintTag(it) }
function build(){
  for(const it of items) mkCard(it);
  for(const r of [5,4,3,2,1,0]){
    const l=document.createElement("div"); l.className="rowlab"; l.id="lab"+r; world.appendChild(l);
    const s=document.createElement("div"); s.id="sl"+r; s.className="slab"; world.appendChild(s);   // 줄 이름표는 지도 안에 (사진과 같이 움직임)
    s.onclick=e=>{ e.stopPropagation(); if(moved)return; const g=R[r].filter(x=>!x.rej); if(g.length) selectMany(g,g[0],false) };   // 지도 빈 곳 클릭(선택 해제)으로 넘어가지 않게   // 그 줄 전부 선택 (선택 불가 빼고)
  }
}
function paintCard(it){   // 사진 아래 가운데: 파일 이름, 그 밑에 별점 (색상 태그는 안 씀)
  it.el.classList.toggle("adj",!!(META.info[it.n]||{}).e);
  it.el.innerHTML=`<div class="cap"><div class="fn">${NM(it)}</div><div class="st">${"★".repeat(it.r)}<span class="off">${"★".repeat(5-it.r)}</span></div></div>`;
}

// 선택 표시: 선택한 장마다 회색 번짐 판 (F), 예전 시안용 판(#plate)은 지금 사진
const plate=document.createElement("div"); plate.id="plate"; const plates=[];
function plateAt(el,it,m){ const b=cardBox(it);
  el.style.left=(it.x+b.dx-m)+"px"; el.style.top=(it.y+b.dy-m)+"px"; el.style.width=(b.w+2*m)+"px"; el.style.height=(b.h+2*m)+"px" }
function placePlate(){ if(!cur)return; plate.style.display=cur.rej?"none":""; if(!cur.rej)plateAt(plate,cur,16);
  const list=[...sel]; while(plates.length<list.length){const d=document.createElement("div"); d.className="plate"; world.appendChild(d); plates.push(d)}
  plates.forEach((d,i)=>{ if(i<list.length&&!list[i].rej){d.style.display="block"; plateAt(d,list[i],22)} else d.style.display="none" }) }
let selRows=new Set();
function place(){
  selRows=new Set([...sel].map(it=>it.r)); if(!sel.size&&cur)selRows.add(cur.r);
  const noDrag=!cardDrag&&!outDrag;
  for(const it of items){const b=cardBox(it); it.el.style.left=(it.x+b.dx)+"px"; it.el.style.top=(it.y+b.dy)+"px"; it.el.classList.toggle("currow",selRows.has(it.r)); it.el.classList.toggle("sel",sel.has(it)); if(noDrag)it.el.classList.remove("dragging")}   // 끌기 중이 아니면 흐림(dragging) 찌꺼기 정리
  for(const r of [5,4,3,2,1,0]){
    const l=document.getElementById("lab"+r);
    l.style.left=(LEFT-150)+"px"; l.style.top=(rowY[r]-34)+"px";
    l.className="rowlab"+(cur&&cur.r==r?" on":"");
    l.innerHTML="";
  }
  placePlate(); stickyLabels(); hud(); if(mode==="focus")renderBridge(); else tellView();
}
function stickyLabels(){
  for(const r of [5,4,3,2,1,0]){   // 지도 좌표: 그 줄 첫 사진 왼쪽 16px, 줄 가운데 높이 (카메라 이동은 지도와 함께라 따로 계산 없음)
    const s=document.getElementById("sl"+r); if(!s)continue;
    const t=(rowY[r]+rowH(r)/2)+"px", l=(LEFT-16)+"px", c="slab"+(cur&&cur.r==r?" on":""), h=`${LABEL(r)} <span style="color:#bbb;font-weight:400">${R[r].length}</span>`;
    if(s.style.top!==t)s.style.top=t; if(s.style.left!==l)s.style.left=l; if(s.className!==c)s.className=c; if(s.dataset.h!==h){ s.dataset.h=h; s.innerHTML=h }   // 바뀐 것만 (카메라 프레임마다 불림)
  }
}
// 지도 끝 제한: 사진 있는 곳 끝까지만 (여백 조금), 지도가 화면보다 작으면 가운데
const PAD=36;
function bounds(){
  let maxLen=1; for(const r in R)maxLen=Math.max(maxLen,R[r].length);
  return {x0:LEFT-PAD-130, x1:LEFT+Math.min(maxLen,wrapCols)*(CW+GAP)-GAP+PAD, y0:TOP-PAD, y1:rowY[0]+bandH(0)+46+PAD};   // 왼쪽은 줄 이름 자리
}
function mapX(z){ const n=wrapCols, w=LABW+16*z+(n*(CW+GAP)-GAP)*z, m=(view.clientWidth-w)/2; return m+LABW-(LEFT-16)*z }   // 이름표 칸 왼쪽 끝 ~ 한 줄 꽉 찬 마지막 사진 오른쪽 끝이 화면 가운데 (좌우 여백 같게, 2026-11-04)
let camXAnim=null;   // Small·Default·Large 바꾸는 0.5초 동안의 가로 위치 (줄당 장수가 바뀌면 가운데 맞춤 위치가 첫 프레임에 툭 튀던 것, 2026-11-07)
function clampCam(c){ c.z=zShow;   // 맵 배율은 세 단계 중 고른 것 (핀치·휠 확대 없음)
  const b=bounds(), vh=view.clientHeight;
  const fit=(lo,hi,v,size)=>{const span=(hi-lo)*c.z; return span<=size ? (size-span)/2-lo*c.z : Math.min(-lo*c.z, Math.max(size-hi*c.z, v))};
  c.x=camXAnim!=null?camXAnim:mapX(c.z); c.y=fit(b.y0,b.y1,c.y,vh); return c;
}
function apply(){
  clampCam(cam);
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  world.style.setProperty("--k",Math.min(1.6,Math.max(.7,1/cam.z)).toFixed(3));   // 사진 아래 글씨는 화면에서 늘 비슷한 크기
  stickyLabels(); sharpen();
}
// 확대했을 때 화면 근처만 큰 사진으로
let sharpT=0;
function sharpen(){clearTimeout(sharpT); sharpT=setTimeout(()=>{
  const big=cam.z>1.15, w=view.clientWidth, h=view.clientHeight;
  for(const it of items){
    const sx=it.x*cam.z+cam.x, sy=it.y*cam.z+cam.y, near=sx>-CW*cam.z*2&&sx<w+CW*cam.z&&sy>-CH*cam.z*2&&sy<h+CH*cam.z;
    const want=(big&&near)?`url("${(cam.z>2.2?bgU:mdU)(it.n)}")`:`url("${smU(it.n)}")`;   // 2.2배까지는 중간 그림으로 충분
    if(it.el.style.backgroundImage!==want && (big&&near || it.el.dataset.big)) {it.el.style.backgroundImage=want; it.el.dataset.big=big&&near?"1":""}
  }
},120)}

// ── 카메라 부드럽게 이동
let anim=null;
function flyTo(tx,ty,tz=zShow,ms=380){
  cancelAnimationFrame(anim); stopInertia();
  const s={...cam}, t0=performance.now();
  ({x:tx,y:ty}=clampCam({x:tx,y:ty,z:tz}));   // 끝 사진도 억지로 가운데로 안 끌어옴
  const step=now=>{const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
    cam.x=s.x+(tx-s.x)*e; cam.y=s.y+(ty-s.y)*e; cam.z=s.z+(tz-s.z)*e; apply(); if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function centerOn(it,z=zShow,ms=520){const w=view.clientWidth,h=view.clientHeight; flyTo(w/2-(it.x+CW/2)*z, h/2-(it.y+CH/2)*z, z, ms)}
let sel=new Set(), anchor=null;
function setCur(it){ if(cur)cur.el.classList.remove("cur"); cur=it; it.el.classList.add("cur"); if(typeof dsel!=="undefined"&&dsel){ dsel=null; stripKey="" } pushSel() }
// 픽 → 캡쳐원 선택 동기화 (0.12초 모아서, 바뀌었을 때만). 캡쳐원에서 온 선택을 적용하는 중엔 되돌려 보내지 않음
let selT=0, selSent="", fromC1=false;
let autoSel=0;   // 지우기·되돌리기 직후의 자동 선택은 캡쳐원 기록에 안 남기게 (사람이 고른 게 아니니까)
function pushSel(){ return;   // 선택 동기화는 하지 않음 (사용자 결정 2026-11-01)
  if(PICK.mode!=="c1"||fromC1)return; if(Date.now()<autoSel){ clearTimeout(selT); selSent=selOrdered().map(it=>BYN[it.n].id).join(","); return } clearTimeout(selT); selT=setTimeout(()=>{ const ids=selOrdered().map(it=>BYN[it.n].id); const k=ids.join(","); if(k===selSent)return; selSent=k; native("selC1",{ids}) },40) }
PickApp_clearSel=function(){ fromC1=true; try{ sel=new Set(); place(); stripKey=""; if(mode==="focus")renderBridge(); else hud() } finally { fromC1=false } };
function select(it,center){ if(!it||it.rej)return; setCur(it); sel=new Set([it]); anchor=it; place(); if(center)centerOn(it); if(bigOn)showBig() }
function selectMany(list,focus,center){ list=list.filter(x=>!x.rej); if(!list.length)return; if(!focus||focus.rej)focus=list[0]; setCur(focus); sel=new Set(list); place(); if(center)centerOn(focus); if(bigOn)showBig() }
function toggleSel(it){ if(it.rej)return; if(sel.has(it)&&sel.size>1){ sel.delete(it); setCur(it===cur?[...sel].pop():cur) } else { sel.add(it); setCur(it) } anchor=it; place(); if(bigOn)showBig() }
let filt=new Set();   // Bridge 필름 스트립 별점 필터 (비어 있으면 All). ⌘⌥0~5 켜고 끄기, 탭 클릭은 그 탭만, ⇧클릭은 여러 개
const stripList=()=>items.filter(it=>!it.gone&&(!filt.size||filt.has(it.r))).sort(ordCmp);
const navList=()=>(mode==="focus"?stripList():(cur?R[cur.r]:[])).filter(it=>!it.rej);   // 방향키·범위 선택이 도는 목록: 선택 불가는 건너뜀
// ── 선택 불가(⌫): 픽 안에서만 기억(세션별), 캡쳐원엔 아무 영향 없음. 우클릭 → 해제. ⌘Z로 되돌림
const IDOF=it=>(BYN[it.n]&&BYN[it.n].id)||it.n, REJKEY=()=>"pick.rej."+(PICK.doc||"");
function loadRej(){ try{ const s=new Set(JSON.parse(localStorage.getItem(REJKEY())||"[]")); for(const it of items){ it.rej=s.has(IDOF(it)); it.el.classList.toggle("rej",it.rej) } }catch(_){} }
function saveRej(){ try{ localStorage.setItem(REJKEY(),JSON.stringify(items.filter(it=>it.rej).map(IDOF))) }catch(_){} }
function setRej(list,on){ for(const it of list){ it.rej=on; it.el.classList.toggle("rej",on); if(on)sel.delete(it) } saveRej(); stripKey=""; tabsKey=""; layout(); place(); if(mode==="focus")renderBridge(); else hud() }
